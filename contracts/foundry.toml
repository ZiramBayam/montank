[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# Monad punya keanehan pelunasan gas (burn gas_limit penuh saat revert) —
# target EVM konservatif; naikkan bila perlu sebelum deploy (cek docs.monad.xyz).
evm_version = "paris"
optimizer = true
optimizer_runs = 200

# --- Fuzz & invariant checks ---
[fuzz]
runs = 256

[invariant]
runs = 64
depth = 64
fail_on_revert = false

[rpc_endpoints]
monad = "${MONAD_RPC_URL}"
